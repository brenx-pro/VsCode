<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Barril de chop</p>
    <script>
       var nome = window.prompt("Qual é seu nome ?")
       document.write(`Olá, Seu nome tem ${nome.length} letras.<br>`); 

       document.writeln(`Seu nome por completo e em maiúsculo é ${nome.toUpperCase()}.<br>`)

       document.writeln(`Seu nome em minúsculo é ${nome.toLowerCase()}`);  
       
    </script>
</body>
</html>
