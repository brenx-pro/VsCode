 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h1>Olá Mundo!</h1>
    <script>
        var n1 = Number.parseFloat(window.prompt("Digite um número "))
        var n2 = Number.parseFloat(window.prompt("Digite outr número "))
        var s = n1 + n2
        window.alert(`A soma entre ${n1} mais ${n2} é de ${s}`)
    </script>
</body>
</html>
